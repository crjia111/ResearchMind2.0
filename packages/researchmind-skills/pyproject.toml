[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "researchmind-skills"
version = "0.1.0"
description = "Portable scientific skills, runtime and optional AgentScope adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
paper = ["pypdf>=5", "python-docx>=1.1"]
vector = ["chromadb>=1.0"]
database = ["pymatgen>=2024.1"]
simulation = ["ase>=3.23", "numpy>=1.26", "pandas>=2.1", "structlog>=24", "mattersim>=1.2,<1.3", "torch>=2.6,<2.7", "torchaudio>=2.6,<2.7", "torchvision>=0.21,<0.22", "scikit-learn>=1.3", "omegaconf>=2.3", "pyzmq>=25", "phonopy>=2.30", "pymatgen>=2024.1", "matplotlib>=3.8"]
agentscope = ["agentscope==2.0.12"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build", "hatchling"]

[project.scripts]
researchmind-skills = "researchmind_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmind_skills"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["src", "tests", "examples", "pyproject.toml", "SCIENTIFIC_PROVENANCE.md"]
