# Cargo workspace root.
#
# Three crates, and the split between them is the whole point:
#
#   crates/osd-core  — the server: workspace paths, the OpenCode sidecar, the
#                      opencode config, projects/runs, and the HTTP gateway.
#                      Depends on NO Tauri, so it runs where there is no display.
#   crates/osd-cli   — `osd`: the same server without a window, plus a client
#                      for it (and for a running desktop's gateway).
#
# The project is browser-first: the CLI serves the Web client and the runtime
# without requiring a display or desktop toolkit.
[workspace]
resolver = "2"
members = ["crates/osd-core", "crates/osd-cli"]

[workspace.package]
version = "0.7.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
osd-core = { path = "crates/osd-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "native-tls",
] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
getrandom = "0.4.3"
