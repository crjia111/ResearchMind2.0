[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "researchmind"
version = "0.2.0"
description = "Local materials research application with portable scientific skills and AgentScope"
requires-python = ">=3.11,<3.13"
dependencies = [
 "researchmind-skills[agentscope,paper,database]",
 "fastapi>=0.104", "uvicorn>=0.24", "websockets>=12,<14",
 "python-dotenv>=1", "httpx[socks]>=0.27", "python-multipart>=0.0.9",
 "aiofiles>=23", "pillow>=10", "sqlalchemy>=2", "redis>=5"
]

[project.optional-dependencies]
simulation = ["researchmind-skills[simulation]"]
vector = ["researchmind-skills[vector]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build", "hatchling"]

[project.scripts]
researchmind-local = "services.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "services", "utils"]

[tool.uv.sources]
researchmind-skills = { path = "packages/researchmind-skills", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages/researchmind-skills/tests"]
